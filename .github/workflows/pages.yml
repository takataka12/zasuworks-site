name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build OGP image
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert assets/ogp.svg -w 1200 -h 630 -o ogp.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify homepage routes and responsive layout
        run: |
          npm install --prefix /tmp/zasu-home-check playwright@1.56.1
          /tmp/zasu-home-check/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/zasu-home-check/node_modules CAPTURE_DIR=/tmp/zasu-home-shots node --test tests/*.test.cjs supabase/tests/*.test.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published studio homepage
        run: |
          python - <<'PYCODE'
          import urllib.request, time, os
          for attempt in range(18):
              try:
                  req = urllib.request.Request('https://zasuworks.jp/?revision=' + os.environ['GITHUB_SHA'], headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      html = response.read().decode('utf-8')
                  if 'studio-home' in html and 'readability.css?v=20261011-r1' in html and 'id="purchase-support"' in html and 'support-promo.css?v=20261012-r2' in html:
                      break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(10)
          else:
              raise SystemExit('Published studio homepage has not propagated yet')
          PYCODE
          NODE_PATH=/tmp/zasu-home-check/node_modules SITE_URL=https://zasuworks.jp CAPTURE_DIR=/tmp/zasu-home-shots/production node --test tests/home.test.cjs tests/account-ui.test.cjs tests/support.test.cjs tests/media.test.cjs

      - name: Save homepage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-screenshots
          path: /tmp/zasu-home-shots
          if-no-files-found: ignore
