name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build OGP image
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert assets/ogp.svg -w 1200 -h 630 -o ogp.png

      - name: Inject social card metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '<meta property="og:url" content="https://zasuworks.jp/">\n<meta name="twitter:card" content="summary">'
          new = '''<meta property="og:url" content="https://zasuworks.jp/">
          <meta property="og:image" content="https://zasuworks.jp/assets/ogp-brand.png">
          <meta property="og:image:secure_url" content="https://zasuworks.jp/assets/ogp-brand.png">
          <meta property="og:image:type" content="image/png">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta property="og:image:alt" content="ZASU WORKS。音楽制作ツール ZASU DAW / ZASU AUDIO / ZASU LOUD。">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="ZASU WORKS｜DAW・Audio Tools・Plugins">
          <meta name="twitter:description" content="ZASU DAW、ZASU AUDIO、ZASU LOUD。音楽制作をもっとシンプルにするクリエイターツールを開発・提供しています。">
          <meta name="twitter:image" content="https://zasuworks.jp/assets/ogp-brand.png">
          <meta name="twitter:image:alt" content="ZASU WORKS。音楽制作ツール ZASU DAW / ZASU AUDIO / ZASU LOUD。">'''
          if '<meta property="og:image" ' in s and '<meta name="twitter:image" ' in s:
              print("Social card metadata already present in source; keeping it unchanged")
              raise SystemExit(0)
          if old not in s:
              raise SystemExit("social metadata anchor not found")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify homepage routes and responsive layout
        run: |
          npm install --prefix /tmp/zasu-home-check playwright@1.56.1
          /tmp/zasu-home-check/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/zasu-home-check/node_modules CAPTURE_DIR=/tmp/zasu-home-shots node --test tests/*.test.cjs supabase/tests/*.test.mjs

      - name: Save homepage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-screenshots
          path: /tmp/zasu-home-shots
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
