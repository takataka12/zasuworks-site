name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build OGP image
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert assets/ogp.svg -w 1200 -h 630 -o ogp.png

      - name: Inject social card metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '<meta property="og:url" content="https://zasuworks.jp/">\n<meta name="twitter:card" content="summary">'
          new = '''<meta property="og:url" content="https://zasuworks.jp/">
          <meta property="og:image" content="https://zasuworks.jp/zasu-daw/assets/ogp-v14-founding.png">
          <meta property="og:image:secure_url" content="https://zasuworks.jp/zasu-daw/assets/ogp-v14-founding.png">
          <meta property="og:image:type" content="image/png">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta property="og:image:alt" content="ZASU DAW v1.4 正式版。FOUNDING USER先着10名、1,980円。今後のアップデート追加料金なし。">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="ZASU DAW v1.4 正式版｜FOUNDING USER募集中">
          <meta name="twitter:description" content="録音からPitch補正・MIX・マスタリングまで。FOUNDING USER先着10名を1,980円で募集中。">
          <meta name="twitter:image" content="https://zasuworks.jp/zasu-daw/assets/ogp-v14-founding.png">
          <meta name="twitter:image:alt" content="ZASU DAW v1.4 正式版。FOUNDING USER先着10名、1,980円。今後のアップデート追加料金なし。">'''
          if old not in s:
              raise SystemExit("social metadata anchor not found")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
