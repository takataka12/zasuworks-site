<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowR" cx="78%" cy="25%" r="48%">
      <stop offset="0" stop-color="#d7ff3f" stop-opacity=".30"/>
      <stop offset=".40" stop-color="#9ebd22" stop-opacity=".11"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="5%" cy="83%" r="31%">
      <stop offset="0" stop-color="#d7ff3f" stop-opacity=".20"/>
      <stop offset=".55" stop-color="#95b51f" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="4" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="fade">
        <feFuncA type="table" tableValues="0 .045"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>
  <rect width="1200" height="630" fill="url(#glowL)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" filter="url(#softNoise)" opacity=".34"/>

  <!-- subtle registration marks -->
  <g stroke="#f4f1e8" stroke-opacity=".35" stroke-width="1">
    <path d="M26 42h34M43 25v34M1140 42h34M1157 25v34M26 588h34M43 571v34M1140 588h34M1157 571v34"/>
  </g>

  <!-- ZW icon -->
  <circle cx="126" cy="112" r="57" fill="#0b0b0b" fill-opacity=".74" stroke="#f5f2e9" stroke-width="3"/>
  <text x="126" y="126" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="36" font-weight="900" fill="#f5f2e9" letter-spacing="-3">ZW</text>

  <!-- Main wordmark -->
  <text x="250" y="323" font-family="Arial,DejaVu Sans,sans-serif" font-size="184" font-weight="900" fill="#f5f2e9" letter-spacing="-13">ZASU</text>
  <text x="247" y="465" font-family="Arial,DejaVu Sans,sans-serif" font-size="171" font-weight="900" fill="#080808" fill-opacity=".05" stroke="#f5f2e9" stroke-width="3" letter-spacing="-12">WORKS</text>

  <!-- Service line -->
  <g font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="600" letter-spacing="5">
    <text x="238" y="526" fill="#f5f2e9">iOS Apps</text>
    <text x="421" y="526" fill="#d7ff3f" font-weight="900">/</text>
    <text x="461" y="526" fill="#f5f2e9">Web Services</text>
    <text x="700" y="526" fill="#d7ff3f" font-weight="900">/</text>
    <text x="743" y="526" fill="#f5f2e9">Music Production</text>
  </g>

  <text x="600" y="577" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="800" letter-spacing="7" fill="#d7ff3f">Built &amp; Released</text>
</svg>